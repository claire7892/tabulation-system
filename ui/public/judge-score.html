<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judge Scoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3>🎤 Judge Scoring</h3>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label"><strong>Contestant:</strong> Maria Santos (Block A)</label>
                </div>

                <form id="scoreForm">
                    <div class="mb-4">
                        <h5>Gown</h5>
                        <input type="number" class="form-control" min="0" max="50" placeholder="Score out of 50" required>
                    </div>

                    <div class="mb-4">
                        <h5>Interview</h5>
                        <input type="number" class="form-control" min="0" max="50" placeholder="Score out of 50" required>
                    </div>

                    <div class="mb-4">
                        <h5>Talent</h5>
                        <input type="number" class="form-control" min="0" max="50" placeholder="Score out of 50" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">Submit Score</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
